<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelPulse - Image Search</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>PixelPulse</h1>
    <form id="search-form">
      <input 
        type="text" 
        id="search-input" 
        placeholder="Search images (e.g. ocean, cats)..." 
        autocomplete="off"
      />
      <button type="submit" id="search-btn">Search</button>
    </form>
  </header>

  <main>
    <!-- Custom Enhancement: Result Counter display -->
    <p id="result-count" class="result-count"></p>

    <!-- Grid Container for Image Cards -->
    <section id="results" class="results-grid"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
